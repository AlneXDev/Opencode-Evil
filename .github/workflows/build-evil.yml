name: build-evil

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        type: choice
        options: [windows-x64, linux-x64, darwin-x64, darwin-arm64]
        default: windows-x64

permissions:
  contents: read

jobs:
  build-desktop:
    runs-on: ${{ inputs.target == 'windows-x64' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      OPENCODE_CHANNEL: evil
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        working-directory: packages/cli
        run: |
          if ($env:RUNNER_OS -eq 'Windows') {
            bun run build --single --baseline
          } else {
            bun run build --target ${{ inputs.target }}
          }
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.4
          OPENCODE_CHANNEL: evil

      - name: Copy CLI to desktop resources
        shell: bash
        run: |
          BIN_NAME="opencodevil2-node"
          EXE=""
          if [[ "$RUNNER_OS" == Windows ]]; then
            BIN_NAME="opencodevil2-node.exe"
            EXE=".exe"
          fi
          CLI_BIN=$(find packages/cli/dist -name "$BIN_NAME" -type f 2>/dev/null | head -1)
          if [[ -z "$CLI_BIN" ]]; then
            echo "CLI binary not found: $BIN_NAME"
            exit 1
          fi
          echo "Found CLI binary: $CLI_BIN"
          mkdir -p packages/desktop/resources
          cp "$CLI_BIN" "packages/desktop/resources/opencodevil-cli${EXE}"

      - name: Build desktop app
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: evil

      - name: Pack desktop app
        working-directory: packages/desktop
        timeout-minutes: 30
        run: bun run pack
        env:
          OPENCODE_CHANNEL: evil

      - name: Preserve unpacked app for installer
        if: inputs.target == 'windows-x64'
        shell: bash
        run: |
          cp -r dist/desktop dist/desktop-app

      - name: Pack NSIS installer
        if: inputs.target == 'windows-x64'
        working-directory: packages/desktop
        timeout-minutes: 30
        run: bun run pack
        env:
          OPENCODE_CHANNEL: evil
          OPENCODE_DESKTOP_APP: ../../dist/desktop-app

      - name: Upload NSIS installer
        if: inputs.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: evil-desktop-installer-windows-x64
          path: dist/desktop/opencode-evil-desktop-win-x64.exe
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evil-desktop-${{ inputs.target }}
          path: dist/desktop
          retention-days: 7
