name: Build and Release OpenCode Evil (All Platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/name (e.g., v1.19.4-evil-r4)'
        required: true
        default: 'v1.19.4-evil-r4'
      app_version:
        description: 'OpenCode app version (semver, e.g., 1.19.4)'
        required: true
        default: '1.19.4'
  push:
    tags:
      - 'v*-evil-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac

    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_CHANNEL: prod
      MODELS_DEV_API_JSON: ${{ github.workspace }}/evil/models-dev-zenlegacy-130.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve app version
        shell: bash
        run: |
          V="${{ github.event.inputs.app_version }}"
          if [ -z "$V" ]; then
            V="${{ github.ref_name }}"
            V="${V%%-evil-*}"
            V="${V#v}"
          fi
          echo "OPENCODE_VERSION=$V" >> "$GITHUB_ENV"
          echo "Using OPENCODE_VERSION=$V"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libxss1 libasound2t64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package
        working-directory: packages/desktop
        run: bunx electron-builder --${{ matrix.target }} --config electron-builder.evil-standalone.config.ts

      - name: Generate checksums
        working-directory: packages/desktop/dist-evil
        shell: bash
        run: |
          shasum -a 256 *.exe *.AppImage *.deb *.rpm *.dmg *.zip 2>/dev/null > "SHA256SUMS-${{ runner.os }}.txt" || true
          cat "SHA256SUMS-${{ runner.os }}.txt"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opencode-evil-${{ runner.os }}
          path: |
            packages/desktop/dist-evil/*.exe
            packages/desktop/dist-evil/*.blockmap
            packages/desktop/dist-evil/*.AppImage
            packages/desktop/dist-evil/*.deb
            packages/desktop/dist-evil/*.rpm
            packages/desktop/dist-evil/*.dmg
            packages/desktop/dist-evil/*.zip
            packages/desktop/dist-evil/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combined checksums
        shell: bash
        run: |
          cd artifacts
          shasum -a 256 * 2>/dev/null | grep -v SHA256SUMS > SHA256SUMS-all.txt || true
          cat SHA256SUMS-all.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: OpenCode Evil ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
