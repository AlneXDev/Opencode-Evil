name: Build and Release OpenCode Evil (All Platforms)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.19.4-evil-r4)'
        required: true
        default: '1.19.4-evil-r4'
  push:
    tags:
      - 'v*-evil-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            config: electron-builder.evil-standalone.config.ts
            artifact_glob: "packages/desktop/dist-evil/*"
          - os: ubuntu-latest
            config: electron-builder.evil-standalone.config.ts
            artifact_glob: "packages/desktop/dist-evil/*"
          - os: macos-latest
            config: electron-builder.evil-standalone.config.ts
            artifact_glob: "packages/desktop/dist-evil/*"

    runs-on: ${{ matrix.os }}
    env:
      OPENCODE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      OPENCODE_CHANNEL: prod
      MODELS_DEV_API_JSON: ${{ github.workspace }}/evil/models-dev-zenlegacy-130.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0 libxss1 libasound2t64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package
        working-directory: packages/desktop
        run: bunx electron-builder --${{ runner.os == 'Windows' && 'win' || runner.os == 'Linux' && 'linux' || 'mac' }} --config ${{ matrix.config }}

      - name: Generate checksums
        working-directory: packages/desktop/dist-evil
        shell: bash
        run: |
          shasum -a 256 * 2>/dev/null | tee SHA256SUMS.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-evil-${{ runner.os }}-${{ github.event.inputs.version || github.ref_name }}
          path: |
            packages/desktop/dist-evil/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          cd artifacts
          shasum -a 256 * 2>/dev/null | tee SHA256SUMS-all.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: OpenCode Evil ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
