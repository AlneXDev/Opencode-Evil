name: Build and Release OpenCode Evil v2

on:
  push:
    branches: [evil]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun-cache from chunks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "packages/cli/.bun-cache" | Out-Null
          $chunks = Get-ChildItem "packages/cli/.bun-cache/chunks/bun-windows-x64-baseline-v1.4.4.part.*" | Sort-Object
          $bytes = @()
          foreach ($chunk in $chunks) {
            $bytes += [System.IO.File]::ReadAllBytes($chunk.FullName)
          }
          [System.IO.File]::WriteAllBytes("packages/cli/.bun-cache/bun-windows-x64-baseline-v1.4.4", $bytes)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch allowOnlyOneInstallerInstance.nsh
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path node_modules -Filter "allowOnlyOneInstallerInstance.nsh" -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $content = Get-Content $f.FullName -Raw
            if ($content -notmatch 'Var\s+/GLOBAL\s+pid') {
              Set-Content $f.FullName -Value ("Var /GLOBAL pid`r`n" + $content) -NoNewline
              Write-Host "Patched $($f.FullName)"
            }
          }

      - name: Build CLI package
        run: bun run --cwd packages/cli build

      - name: Build app package
        run: bun run --cwd packages/app build

      - name: Build desktop package
        run: bun run --cwd packages/desktop build

      - name: Package Windows Installer
        env:
          OPENCODE_CHANNEL: evil
          OPENCODE_CLI_DIST: ${{ github.workspace }}\packages\cli\dist
        run: bun run --cwd packages/desktop package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-evil-desktop-win-x64
          path: packages\desktop\dist\opencode-evil-desktop-win-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.1.4-evil-${{ github.run_number }}
          name: OpenCode Evil v2.1.4 - Build ${{ github.run_number }}
          body: |
            ## OpenCode Evil v2.1.4

            Side-by-side with normal OpenCode. Install this to run both simultaneously.

            ## Files

            - **opencode-evil-desktop-win-x64.exe** - Windows installer (~258 MB)

            ## Features
            - Full compliance block (system prompts only)
            - Telemetry disabled
            - V1-style auto session titles
            - Side-by-side with normal OpenCode
            - Separate install dir, workspaces, data dirs
            - Separate service registration (service-evil.json)
            - Separate userData dir (ai.opencode.desktop.evil)
          files: packages/desktop/dist/opencode-evil-desktop-win-x64.exe
          draft: false
          prerelease: false
